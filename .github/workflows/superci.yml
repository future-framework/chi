# go-chi/chi's .github/workflows/ci.yml: test (os: ubuntu-latest, go-version: 1.27.x), for the SuperCI scoreboard.
name: SuperCI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test / superci
    runs-on: superci
    timeout-minutes: 30
    env:
      GOPATH: ${{ github.workspace }}

    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: ${{ env.GOPATH }}/src/github.com/${{ github.repository }}
          persist-credentials: false
      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.27.x
          check-latest: true
          cache: false
      - name: Test
        run: |
          go get -d -t ./...
          make test
